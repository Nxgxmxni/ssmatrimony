<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0B2A6B"/>
      <stop offset="100%" stop-color="#31103F"/>
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" rx="28" fill="url(#bgGrad5)"/>

  <!-- Gold Border Frame -->
  <rect x="12" y="12" width="776" height="476" rx="20" fill="none" stroke="url(#goldGrad5)" stroke-width="3" opacity="0.85"/>

  <!-- Ring Sparkle & Flower Mandap Pattern -->
  <circle cx="400" cy="250" r="190" fill="none" stroke="#D4A017" stroke-width="1" opacity="0.1" stroke-dasharray="10 8"/>
  <circle cx="400" cy="250" r="140" fill="none" stroke="#D4A017" stroke-width="1.5" opacity="0.08"/>

  <!-- Central Card -->
  <rect x="120" y="80" width="560" height="340" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#goldGrad5)" stroke-width="2" filter="url(#glow5)"/>

  <!-- Step Icon: Interlocking Engagement Rings -->
  <circle cx="400" cy="170" r="50" fill="#31103F" stroke="url(#goldGrad5)" stroke-width="3"/>
  <circle cx="385" cy="170" r="20" fill="none" stroke="#D4A017" stroke-width="4"/>
  <circle cx="415" cy="170" r="20" fill="none" stroke="#FEF08A" stroke-width="4"/>
  <path d="M 385 146 L 388 140 L 382 140 Z" fill="#FEF08A"/>
  <path d="M 415 146 L 418 140 L 412 140 Z" fill="#FEF08A"/>

  <!-- Text Overlay -->
  <text x="400" y="260" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#D4A017" letter-spacing="3">STEP 05 • ENGAGEMENT CEREMONY</text>
  <text x="400" y="300" text-anchor="middle" font-family="'Outfit', 'Georgia', serif" font-size="28" font-weight="800" fill="#FFFFFF">Ring Exchange &amp; Blessings</text>
  <text x="400" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" fill="#CBD5E1">Bride &amp; Groom Exchange Engagement Rings with Family Celebrations</text>

  <!-- Bottom Badge -->
  <rect x="290" y="365" width="220" height="32" rx="16" fill="#FEF3C7" stroke="#D4A017" stroke-width="1"/>
  <text x="400" y="386" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#92400E">💖 Match Confirmed &amp; Blessed</text>
</svg>
