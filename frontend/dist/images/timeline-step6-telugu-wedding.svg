<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="50%" stop-color="#0B2A6B"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="goldGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" rx="28" fill="url(#bgGrad6)"/>

  <!-- Gold Border Frame -->
  <rect x="12" y="12" width="776" height="476" rx="20" fill="none" stroke="url(#goldGrad6)" stroke-width="3.5" opacity="0.9"/>

  <!-- Mandap Arch & Marigold Garland Watermark -->
  <path d="M 200 480 C 200 200 600 200 600 480" fill="none" stroke="#D4A017" stroke-width="2" opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="400" cy="250" r="160" fill="none" stroke="#D4A017" stroke-width="1.5" opacity="0.08"/>

  <!-- Central Card -->
  <rect x="120" y="80" width="560" height="340" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#goldGrad6)" stroke-width="2" filter="url(#glow6)"/>

  <!-- Step Icon: Sacred Mangalsutra & Jeelakarra Bellam Coconut Motif -->
  <circle cx="400" cy="170" r="50" fill="#4A0E17" stroke="url(#goldGrad6)" stroke-width="3"/>
  <!-- Mangalsutra Sacred Pendant Vector -->
  <path d="M 380 155 Q 400 185 420 155" fill="none" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="175" r="8" fill="#FEF08A" stroke="#D4A017" stroke-width="2"/>
  <path d="M 400 183 V 193" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>

  <!-- Text Overlay -->
  <text x="400" y="260" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#D4A017" letter-spacing="3">STEP 06 • TRADITIONAL TELUGU WEDDING</text>
  <text x="400" y="300" text-anchor="middle" font-family="'Outfit', 'Georgia', serif" font-size="28" font-weight="800" fill="#FFFFFF">Jeelakarra Bellam &amp; Mangalsutra</text>
  <text x="400" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" fill="#CBD5E1">Sacred Rituals under Mandap with Blessings, Garlands &amp; Vows</text>

  <!-- Bottom Badge -->
  <rect x="290" y="365" width="220" height="32" rx="16" fill="#FEE2E2" stroke="#991B1B" stroke-width="1"/>
  <text x="400" y="386" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#991B1B">💍 Sacred Telugu Kalyanam</text>
</svg>
