<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3B91" />
      <stop offset="50%" stop-color="#123B8F" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(11,59,145,0.85)" />
      <stop offset="100%" stop-color="rgba(11,59,145,0)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Subtle Ornamental Telugu Mandala Pattern -->
  <g opacity="0.12" stroke="#D4AF37" stroke-width="1.5" fill="none">
    <circle cx="300" cy="375" r="220" />
    <circle cx="300" cy="375" r="170" stroke-dasharray="8 8" />
    <circle cx="300" cy="375" r="120" />
    <polygon points="300,155 375,375 300,595 225,375" />
    <polygon points="155,375 300,300 445,375 300,450" />
  </g>

  <!-- Golden Arch Framing -->
  <path d="M 60 750 L 60 260 C 60 120, 540 120, 540 260 L 540 750 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>
  
  <!-- Center Silhouette / Icon Illustration -->
  <g transform="translate(300, 320)" text-anchor="middle">
    <!-- Heart & Wedding Ring Graphic -->
    <circle cx="0" cy="-40" r="55" fill="rgba(212,175,55,0.15)" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M -20 -40 A 15 15 0 0 1 0 -60 A 15 15 0 0 1 20 -40 Q 20 -15 0 10 Q -20 -15 -20 -40 Z" fill="url(#goldGrad)"/>
    <circle cx="-15" cy="-25" r="22" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    <circle cx="15" cy="-25" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  </g>

  <!-- Overlay for Text readability -->
  <rect x="0" y="450" width="600" height="300" fill="url(#overlayGrad)" rx="24"/>

  <!-- Text Info -->
  <text x="300" y="550" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    HERO COUPLE IMAGE
  </text>
  <text x="300" y="590" font-family="'Inter', sans-serif" font-weight="500" font-size="16" fill="#D4AF37" text-anchor="middle">
    /images/hero-couple-placeholder.jpg
  </text>
  <text x="300" y="625" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#EAF4FF" text-anchor="middle" opacity="0.8">
    Replace this file with your official high-res Telugu Bride &amp; Groom photo
  </text>
</svg>
