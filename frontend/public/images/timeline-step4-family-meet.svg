<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2A6B"/>
      <stop offset="50%" stop-color="#071B45"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" rx="28" fill="url(#bgGrad4)"/>

  <!-- Gold Border Frame -->
  <rect x="12" y="12" width="776" height="476" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>

  <!-- Decorative Mandala Watermark Circles -->
  <circle cx="400" cy="250" r="180" fill="none" stroke="#D4A017" stroke-width="1" opacity="0.08" stroke-dasharray="8 6"/>
  <circle cx="400" cy="250" r="230" fill="none" stroke="#D4A017" stroke-width="1.5" opacity="0.06"/>
  <circle cx="400" cy="250" r="120" fill="none" stroke="#D4A017" stroke-width="1" opacity="0.1"/>

  <!-- Corner Ornamental Accent -->
  <path d="M 30 30 L 70 30 L 30 70 Z" fill="url(#goldGrad)" opacity="0.4"/>
  <path d="M 770 30 L 730 30 L 770 70 Z" fill="url(#goldGrad)" opacity="0.4"/>
  <path d="M 30 470 L 70 470 L 30 430 Z" fill="url(#goldGrad)" opacity="0.4"/>
  <path d="M 770 470 L 730 470 L 770 430 Z" fill="url(#goldGrad)" opacity="0.4"/>

  <!-- Central Glassmorphic Card Container -->
  <rect x="120" y="80" width="560" height="340" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow4)"/>

  <!-- Step Icon: Home & Tea Family Icon -->
  <circle cx="400" cy="170" r="50" fill="#0B2A6B" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Home Roof & Tea Cup Vector Illustration -->
  <path d="M 380 175 L 400 155 L 420 175 V 190 H 380 Z" fill="none" stroke="#D4A017" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 390 190 H 410" stroke="#D4A017" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 395 145 C 395 140 405 140 405 135" fill="none" stroke="#FEE2E2" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Text Overlay -->
  <text x="400" y="260" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#D4A017" letter-spacing="3">STEP 04 • FAMILY MEETING</text>
  <text x="400" y="300" text-anchor="middle" font-family="'Outfit', 'Georgia', serif" font-size="28" font-weight="800" fill="#FFFFFF">Two Telugu Families Meet</text>
  <text x="400" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" fill="#CBD5E1">Discussion on Traditions, Values &amp; Expectations over Tea &amp; Sweets</text>

  <!-- Bottom Badge -->
  <rect x="290" y="365" width="220" height="32" rx="16" fill="#E6F4EA" stroke="#137333" stroke-width="1"/>
  <text x="400" y="386" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#137333">✓ Family Assisted Meeting</text>
</svg>
