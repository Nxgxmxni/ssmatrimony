<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="50%" stop-color="#0B2A6B"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="goldGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" rx="28" fill="url(#bgGrad7)"/>

  <!-- Gold Border Frame -->
  <rect x="12" y="12" width="776" height="476" rx="20" fill="none" stroke="url(#goldGrad7)" stroke-width="3.5" opacity="0.9"/>

  <!-- Showering Rose Petals & Golden Hour Sunburst Watermark -->
  <circle cx="400" cy="250" r="190" fill="none" stroke="#FEF08A" stroke-width="1" opacity="0.1" stroke-dasharray="12 6"/>
  <!-- Floating Petals -->
  <circle cx="220" cy="120" r="6" fill="#F43F5E" opacity="0.4"/>
  <circle cx="600" cy="140" r="8" fill="#F43F5E" opacity="0.3"/>
  <circle cx="180" cy="380" r="7" fill="#F43F5E" opacity="0.35"/>
  <circle cx="650" cy="360" r="9" fill="#F43F5E" opacity="0.4"/>

  <!-- Central Card -->
  <rect x="120" y="80" width="560" height="340" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#goldGrad7)" stroke-width="2" filter="url(#glow7)"/>

  <!-- Step Icon: Married Couple Heart & Golden Sun -->
  <circle cx="400" cy="170" r="50" fill="#065F46" stroke="url(#goldGrad7)" stroke-width="3"/>
  <path d="M 400 185 C 370 155 380 140 392 150 C 400 158 400 158 400 158 C 400 158 400 158 408 150 C 420 140 430 155 400 185 Z" fill="#FEF08A" stroke="#D4A017" stroke-width="1.5"/>

  <!-- Text Overlay -->
  <text x="400" y="260" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#D4A017" letter-spacing="3">STEP 07 • HAPPILY EVER AFTER</text>
  <text x="400" y="300" text-anchor="middle" font-family="'Outfit', 'Georgia', serif" font-size="28" font-weight="800" fill="#FFFFFF">Happily Married Couples</text>
  <text x="400" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" fill="#CBD5E1">Walking Together with Lifetime Memories &amp; Family Blessings</text>

  <!-- Bottom Badge -->
  <rect x="290" y="365" width="220" height="32" rx="16" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
  <text x="400" y="386" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#047857">✨ 5000+ Happy Marriages</text>
</svg>
